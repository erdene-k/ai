<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>sarn.ai</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,500;0,600;1,500;1,600&family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="home.css">
</head>
<body>

<div class="phone">

  <!-- ══ iOS status bar ══ -->
  <div class="statusbar">
    <span class="statusbar__time">16:55</span>
    <span class="island"><i></i></span>
    <span class="statusbar__icons">
      <svg class="ic" viewBox="0 0 19 12" aria-hidden="true">
        <rect x="0" y="8.5" width="3" height="3.5" rx="1"/>
        <rect x="4.6" y="6" width="3" height="6" rx="1"/>
        <rect x="9.2" y="3" width="3" height="9" rx="1"/>
        <rect x="13.8" y="0" width="3" height="12" rx="1"/>
      </svg>
      <svg class="ic" viewBox="0 0 17 12" aria-hidden="true">
        <path d="M8.5 11.6 6 8.9a3.6 3.6 0 0 1 5 0l-2.5 2.7Z"/>
        <path d="M8.5 6.3a5.9 5.9 0 0 0-4.3 1.9L2.9 6.8a7.7 7.7 0 0 1 11.2 0l-1.3 1.4a5.9 5.9 0 0 0-4.3-1.9Z"/>
        <path d="M8.5 2.2a10 10 0 0 0-7.1 3L0 3.8a12 12 0 0 1 17 0l-1.4 1.4a10 10 0 0 0-7.1-3Z"/>
      </svg>
      <span class="batt"><i></i></span>
    </span>
  </div>

  <!-- ══ In-app browser chrome ══ -->
  <header class="chrome">
    <span class="chrome__title">sarn.ai</span>
    <button class="chrome__close" type="button" aria-label="Хаах">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7 17 17M17 7 7 17"/></svg>
    </button>
  </header>

  <!-- ══ Home ══ -->
  <main class="paper home">

    <div class="home__top">
      <span class="brand">
        <svg class="brand__moon" viewBox="0 0 32 32" aria-hidden="true">
          <path d="M25.6 20.1A11.4 11.4 0 0 1 12.2 3.4a12.8 12.8 0 1 0 16.4 16.4 11.4 11.4 0 0 1-3 .3Z"/>
        </svg>
        <span class="brand__word">sarn.ai</span>
      </span>

      <!-- profile — replaces the settings gear -->
      <button class="me" type="button" aria-label="Миний профайл">
        <span class="me__face" aria-hidden="true"></span>
        <span class="me__badge" aria-hidden="true">
          <svg viewBox="0 0 32 32"><path d="M25.6 20.1A11.4 11.4 0 0 1 12.2 3.4a12.8 12.8 0 1 0 16.4 16.4 11.4 11.4 0 0 1-3 .3Z"/></svg>
        </span>
      </button>
    </div>

    <p class="hello">Сайн уу, саша</p>
    <h1 class="ask serif">Хэнтэй<br>ярилцах вэ?</h1>

    <!-- ══ chat preview — the page's main event ══ -->
    <article class="chat satin">
      <header class="chat__head">
        <span class="face face--halin face--online" role="img" aria-label="Халиун"></span>
        <span class="chat__id">
          <b>Халиун</b>
          <span class="level"><i class="moon moon--crescent" aria-hidden="true"></i>найзууд</span>
        </span>
        <button class="like" type="button" aria-pressed="false" aria-label="Дуртай">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 20.4C12 20.4 3.6 15.6 3.6 10.1A4.2 4.2 0 0 1 12 8.1a4.2 4.2 0 0 1 8.4 2c0 5.5-8.4 10.3-8.4 10.3Z"/>
          </svg>
        </button>
      </header>

      <p class="bubble">Зөвхөн чамд шүү</p>

      <footer class="chat__foot">
        <span class="typing" aria-label="бичиж байна"><i></i><i></i><i></i></span>
        <span class="stamp">16:48</span>
        <button class="go" type="button">Үргэлжлүүлэх</button>
      </footer>
    </article>

    <h2 class="section serif">Бүх дүр</h2>

    <div class="grid">
      <a class="card card--namuun" href="profile.html">
        <i class="moon moon--new card__moon" aria-hidden="true"></i>
        <span class="card__name">Намуун<span>21</span></span>
      </a>
      <button class="card card--hulan" type="button">
        <i class="moon moon--half card__moon" aria-hidden="true"></i>
        <span class="card__name">Хулан<span>32</span></span>
      </button>
      <button class="card card--temka" type="button">
        <i class="moon moon--new card__moon" aria-hidden="true"></i>
        <span class="card__name">Тэмка<span>26</span></span>
      </button>
      <a class="card card--halin" href="profile.html">
        <i class="moon moon--crescent card__moon" aria-hidden="true"></i>
        <span class="card__name">Халиун<span>24</span></span>
      </a>
    </div>

  </main>
</div>

<script>
  // heart toggle — the one playful bit of state on the page
  var like = document.querySelector('.like');
  like.addEventListener('click', function () {
    var on = like.getAttribute('aria-pressed') === 'true';
    like.setAttribute('aria-pressed', String(!on));
    if (!on) {
      like.classList.remove('is-pop');
      void like.offsetWidth;
      like.classList.add('is-pop');
    }
  });
</script>

</body>
</html>
